<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Result - Online Quiz Application</title>
<link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="navbar">
        <div class="brand">Online Quiz Application</div>
        <div class="user-info" id="user-info"></div>
      </div>

      <header>
        <h1>Your Quiz Result</h1>
      </header>

      <div id="alert-container"></div>

      <div class="card" id="result-card">
        <h3 id="score-heading"></h3>
        <p id="score-details"></p>
        <button id="restart-btn">Take Quiz Again</button>
        <button id="home-btn" class="secondary">Back to Home</button>
      </div>
    </div>

    <script src="scripts/app.js"></script>
    <script src="scripts/result.js"></script>
  </body>
</html>
